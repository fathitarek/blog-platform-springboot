spring:
  datasource:
    url: jdbc:h2:mem:blogtest;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: simple

app:
  jwt:
    issuer: blog-platform-springboot-test
    secret: c3VwZXItc2VjcmV0LXN1cGVyLXNlY3JldC1zdXBlci1zZWNyZXQxMjM0NTY=
    expiration-minutes: 120
  cache:
    redis-enabled: false
